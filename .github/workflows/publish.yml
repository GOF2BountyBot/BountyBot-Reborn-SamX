# ── Phase 3: Build ───────────────────────────────────────────────────────────
# Build jobs push only `sha-<short>` (and `{{version}}` on tag pushes) to GHCR.
# The floating `latest` tag is added later, by the scan job, only if Trivy passes.
#
# On pull requests, the image is built locally (load:true) and NOT pushed; the
# scan job picks up the local image instead of pulling from GHCR.
#
# Each build job exposes `image_ref` (the sha-tagged ref) as an output so the
# downstream scan job knows exactly which tag to pull.

  build-bot-core:
    name: bot-core image
    runs-on: ubuntu-latest
    needs: [test-bot-core, test-discord-gateway, test-blender-service]
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.refs.outputs.image_ref }}
      sha_tag: ${{ steps.refs.outputs.sha_tag }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/bot-core
          # NOTE: deliberately no `latest` here — that tag is applied by the scan job on pass
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push (sha-tagged only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/bot-core/Dockerfile
          # On PR: load locally for the scan job to pick up (no push to GHCR)
          # Otherwise: push to GHCR with sha-<short> (+ semver if applicable)
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bot-core
          cache-to: type=gha,scope=bot-core,mode=max

      - name: Compute image refs for downstream scan
        id: refs
        run: |
          # First tag from metadata-action is always the sha-<short> tag
          IMAGE_REF=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          SHA_TAG="${IMAGE_REF##*:}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}"     >> "$GITHUB_OUTPUT"

  build-discord-gateway:
    name: discord-gateway image
    runs-on: ubuntu-latest
    needs: [test-bot-core, test-discord-gateway, test-blender-service]
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.refs.outputs.image_ref }}
      sha_tag: ${{ steps.refs.outputs.sha_tag }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/discord-gateway
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push (sha-tagged only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/discord-gateway/Dockerfile
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=discord-gateway
          cache-to: type=gha,scope=discord-gateway,mode=max

      - name: Compute image refs for downstream scan
        id: refs
        run: |
          IMAGE_REF=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          SHA_TAG="${IMAGE_REF##*:}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}"     >> "$GITHUB_OUTPUT"

  build-blender-cpu:
    name: blender-service (CPU) image
    runs-on: ubuntu-latest
    needs: [test-bot-core, test-discord-gateway, test-blender-service]
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.refs.outputs.image_ref }}
      sha_tag: ${{ steps.refs.outputs.sha_tag }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/blender-service
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push (sha-tagged only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/blender-service/Dockerfile.cpu
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=blender-cpu
          cache-to: type=gha,scope=blender-cpu,mode=max

      - name: Compute image refs for downstream scan
        id: refs
        run: |
          IMAGE_REF=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          SHA_TAG="${IMAGE_REF##*:}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}"     >> "$GITHUB_OUTPUT"

  build-blender-gpu:
    name: blender-service (GPU) image
    runs-on: ubuntu-latest
    needs: [test-bot-core, test-discord-gateway, test-blender-service]
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.refs.outputs.image_ref }}
      sha_tag: ${{ steps.refs.outputs.sha_tag }}
    # NOTE: GPU builds run on standard ubuntu-latest — no GPU hardware is needed
    # to BUILD the image, only to RUN it. The CUDA runtime libs are baked in from
    # the nvidia/cuda base; actual GPU access requires nvidia-docker at runtime.

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/blender-service-gpu
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push (sha-tagged only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/blender-service/Dockerfile.gpu
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=blender-gpu
          cache-to: type=gha,scope=blender-gpu,mode=max

      - name: Compute image refs for downstream scan
        id: refs
        run: |
          IMAGE_REF=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          SHA_TAG="${IMAGE_REF##*:}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}"     >> "$GITHUB_OUTPUT"

# ── Phase 4: Scan ────────────────────────────────────────────────────────────
# One scan job per image, each `needs:` its own build job. Pulls the pushed
# `sha-<short>` ref from GHCR (or uses the locally-loaded image on PR), runs:
#
#   1. Trivy → SARIF → upload to GitHub Security tab (always runs, never fails)
#   2. Trivy → table → enforcement gate; sets failure if vulns ≥ FAIL_SEVERITY
#   3. On PASS  + non-PR: tag the image as `latest` via `docker buildx imagetools create`
#   4. On FAIL  + non-PR: delete the sha-<short> package version from GHCR
#                         (the vulnerable image becomes unpullable)
#
# The job's overall success/failure mirrors the enforcement gate, so the
# Pipeline summary correctly reflects whether the image survived scanning.

  scan-bot-core:
    name: bot-core scan & promote
    runs-on: ubuntu-latest
    needs: build-bot-core
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      security-events: write   # Trivy SARIF upload

    env:
      IMAGE_NAME: bot-core
      IMAGE_REF:  ${{ needs.build-bot-core.outputs.image_ref }}
      SHA_TAG:    ${{ needs.build-bot-core.outputs.sha_tag }}

    steps:
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan (SARIF → Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-${{ env.IMAGE_NAME }}.sarif
          ignore-unfixed: true
          vuln-type: os,library
          timeout: ${{ env.TRIVY_TIMEOUT }}
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ env.IMAGE_NAME }}.sarif
          category: trivy-${{ env.IMAGE_NAME }}

      - name: Trivy scan (enforcement gate)
        id: trivy-gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          severity: ${{ env.TRIVY_FAIL_SEVERITY }}
          exit-code: ${{ env.TRIVY_SCAN_MODE == 'enforce' && '1' || '0' }}
          ignore-unfixed: true
          vuln-type: os,library
          timeout: ${{ env.TRIVY_TIMEOUT }}
          output: trivy-${{ env.IMAGE_NAME }}.txt
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

      - name: Append scan results to job summary
        if: always()
        run: |
          {
            echo "## Trivy scan — ${IMAGE_NAME}"
            echo ""
            echo "Image: \`${IMAGE_REF}\`"
            echo "Mode: \`${TRIVY_SCAN_MODE}\` · Fail severity: \`${TRIVY_FAIL_SEVERITY:-none}\` · Result: ${{ steps.trivy-gate.outcome }}"
            echo ""
            echo '```'
            cat "trivy-${IMAGE_NAME}.txt" 2>/dev/null || echo "(no findings file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ─── Pass path: promote `latest` ──────────────────────────────────────
      - name: Promote `latest` tag (on scan pass)
        if: success() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          SRC="${IMAGE_REF}"
          DST="${IMAGE_PREFIX}/${IMAGE_NAME}:latest"
          echo "Promoting ${SRC}  →  ${DST}"
          docker buildx imagetools create --tag "${DST}" "${SRC}"

      # ─── Fail path: nuke the vulnerable image ─────────────────────────────
      # `gh api` deletes the package VERSION whose tag matches sha-<short>.
      # The version_id has to be looked up first; container package names use
      # `/` URL-encoded as `%2F`.
      - name: Delete vulnerable image from GHCR (on scan fail)
        if: failure() && steps.trivy-gate.conclusion == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PKG_NAME_ENC="${IMAGE_REPO}%2F${IMAGE_NAME}"
          echo "Looking up version for tag ${SHA_TAG} in package ${PKG_NAME_ENC}"

          VERSION_ID=$(
            gh api -H "Accept: application/vnd.github+json" \
              "/orgs/${IMAGE_OWNER}/packages/container/${PKG_NAME_ENC}/versions" \
              --paginate \
              --jq ".[] | select(.metadata.container.tags | index(\"${SHA_TAG}\")) | .id" \
              | head -n1
          )

          if [ -z "${VERSION_ID}" ]; then
            echo "::warning::Could not find package version for tag ${SHA_TAG} — skipping delete"
            exit 0
          fi

          echo "Deleting package version ${VERSION_ID} (tag ${SHA_TAG})"
          gh api -X DELETE \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${IMAGE_OWNER}/packages/container/${PKG_NAME_ENC}/versions/${VERSION_ID}"
          echo "::warning::Deleted vulnerable image ${IMAGE_REF} from GHCR (Trivy scan failed)"


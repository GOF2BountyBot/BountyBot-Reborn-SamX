name: Test, Build & Publish

# Runs lint → tests → image builds in sequence.
# Images are only built (and pushed to GHCR) when all tests pass.
#
# Triggers:
#   - Push to main/master  → tests + build + push to GHCR
#   - Push a git tag       → tests + build + push to GHCR  (semver tags)
#   - Pull request         → tests + build only (no push)
#   - Manual dispatch      → tests + build + push to GHCR
#
# Images published:
#   ghcr.io/gof2bountybot/bountybot-reborn-samx/bot-core
#   ghcr.io/gof2bountybot/bountybot-reborn-samx/discord-gateway
#   ghcr.io/gof2bountybot/bountybot-reborn-samx/blender-service        (CPU, python:3.13-slim-trixie)
#   ghcr.io/gof2bountybot/bountybot-reborn-samx/blender-service-gpu    (CUDA runtime, Python 3.13)
#
# Image tags applied:
#   On push to main/master or manual dispatch:
#     - sha-<short-sha>   (immutable, per-commit)
#     - latest
#   On git tag push (e.g. git tag v1.2.3 && git push origin v1.2.3):
#     - sha-<short-sha>   (immutable)
#     - 1.2.3             (exact semver)
#     - latest
#   On pull request:
#     - sha-<short-sha>   (build smoke test only, not pushed)

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/gof2bountybot/bountybot-reborn-samx

  # ── Trivy image-scan tuning ────────────────────────────────────────────────
  # FAIL_SEVERITY: comma-separated severities that BLOCK the push.
  #   strict       → "CRITICAL,HIGH"           (default — recommended)
  #   critical-only → "CRITICAL"
  #   report-only  → ""    (set SCAN_MODE=report-only below; severities ignored)
  TRIVY_FAIL_SEVERITY: "CRITICAL,HIGH"

  # SCAN_MODE: gate behaviour
  #   enforce      → fail the job if vulns at FAIL_SEVERITY are found (default)
  #   report-only  → upload SARIF + summary, never fail
  TRIVY_SCAN_MODE: "enforce"

  # Trivy DB scan timeout (image scans of large CUDA bases can be slow)
  TRIVY_TIMEOUT: "15m"

# ── Phase 1: Lint ────────────────────────────────────────────────────────────

jobs:
  lint:
    name: Ruff lint & format check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check (lint)
        run: ruff check services/bot-core/src services/bot-core/tests services/discord-gateway/src services/discord-gateway/tests services/blender-service/src services/blender-service/tests

      - name: Ruff format check
        run: ruff format --check services/bot-core/src services/bot-core/tests services/discord-gateway/src services/discord-gateway/tests services/blender-service/src services/blender-service/tests

# ── Phase 2: Tests ───────────────────────────────────────────────────────────

  test-bot-core:
    name: bot-core tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bountydb
          POSTGRES_USER: bounty
          POSTGRES_PASSWORD: bounty
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: services/bot-core
        run: pip install -r requirements.txt

      - name: Copy shared bblogger
        run: cp services/shared/bblogger.py services/bot-core/src/shared/bblogger.py || true

      - name: Run tests
        id: pytest
        working-directory: services/bot-core
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: bountydb
          POSTGRES_USER: bounty
          POSTGRES_PASSWORD: bounty
        run: |
          python -m pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-branch \
            --timeout=60 \
            --junitxml=junit.xml \
            -q

      - name: Publish test & coverage summary
        if: always()
        working-directory: services/bot-core
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, os, pathlib

          junit = ET.parse("junit.xml").getroot()
          suite = junit if junit.tag == "testsuite" else junit.find("testsuite")
          total   = int(suite.get("tests",   0))
          failed  = int(suite.get("failures",0)) + int(suite.get("errors", 0))
          skipped = int(suite.get("skipped", 0))
          passed  = total - failed - skipped
          duration = float(suite.get("time", 0))

          cov = ET.parse("coverage.xml").getroot()
          line_rate   = float(cov.get("line-rate",   0)) * 100
          branch_rate = float(cov.get("branch-rate", 0)) * 100

          status = "passed" if failed == 0 else f"{failed} failed"

          summary = f"""## bot-core test results

          | Metric | Value |
          |--------|-------|
          | Result | {status} |
          | Tests | {total} |
          | Passed | {passed} |
          | Failed | {failed} |
          | Skipped | {skipped} |
          | Duration | {duration:.1f}s |
          | Line coverage | {line_rate:.1f}% |
          | Branch coverage | {branch_rate:.1f}% |
          """

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-bot-core
          path: services/bot-core/coverage.xml
          if-no-files-found: warn

  test-discord-gateway:
    name: discord-gateway tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: services/discord-gateway
        run: pip install -r requirements.txt

      - name: Copy shared bblogger
        run: cp services/shared/bblogger.py services/discord-gateway/src/shared/bblogger.py || true

      - name: Run tests
        id: pytest
        working-directory: services/discord-gateway
        run: |
          python -m pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-branch \
            --timeout=60 \
            --junitxml=junit.xml \
            -q

      - name: Publish test & coverage summary
        if: always()
        working-directory: services/discord-gateway
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, os

          junit = ET.parse("junit.xml").getroot()
          suite = junit if junit.tag == "testsuite" else junit.find("testsuite")
          total   = int(suite.get("tests",   0))
          failed  = int(suite.get("failures",0)) + int(suite.get("errors", 0))
          skipped = int(suite.get("skipped", 0))
          passed  = total - failed - skipped
          duration = float(suite.get("time", 0))

          cov = ET.parse("coverage.xml").getroot()
          line_rate   = float(cov.get("line-rate",   0)) * 100
          branch_rate = float(cov.get("branch-rate", 0)) * 100

          status = "passed" if failed == 0 else f"{failed} failed"

          summary = f"""## discord-gateway test results

          | Metric | Value |
          |--------|-------|
          | Result | {status} |
          | Tests | {total} |
          | Passed | {passed} |
          | Failed | {failed} |
          | Skipped | {skipped} |
          | Duration | {duration:.1f}s |
          | Line coverage | {line_rate:.1f}% |
          | Branch coverage | {branch_rate:.1f}% |
          """

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-discord-gateway
          path: services/discord-gateway/coverage.xml
          if-no-files-found: warn

  test-blender-service:
    name: blender-service tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: services/blender-service
        run: pip install -r requirements.txt

      - name: Copy shared bblogger
        run: cp services/shared/bblogger.py services/blender-service/src/shared/bblogger.py || true

      - name: Run tests
        id: pytest
        working-directory: services/blender-service
        run: |
          python -m pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-branch \
            --timeout=60 \
            --junitxml=junit.xml \
            -q

      - name: Publish test & coverage summary
        if: always()
        working-directory: services/blender-service
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, os

          junit = ET.parse("junit.xml").getroot()
          suite = junit if junit.tag == "testsuite" else junit.find("testsuite")
          total   = int(suite.get("tests",   0))
          failed  = int(suite.get("failures",0)) + int(suite.get("errors", 0))
          skipped = int(suite.get("skipped", 0))
          passed  = total - failed - skipped
          duration = float(suite.get("time", 0))

          cov = ET.parse("coverage.xml").getroot()
          line_rate   = float(cov.get("line-rate",   0)) * 100
          branch_rate = float(cov.get("branch-rate", 0)) * 100

          status = "passed" if failed == 0 else f"{failed} failed"

          summary = f"""## blender-service test results

          | Metric | Value |
          |--------|-------|
          | Result | {status} |
          | Tests | {total} |
          | Passed | {passed} |
          | Failed | {failed} |
          | Skipped | {skipped} |
          | Duration | {duration:.1f}s |

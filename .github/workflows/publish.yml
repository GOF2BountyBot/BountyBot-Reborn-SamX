name: Test, Build & Publish

# Pipeline phases:
#   0. Cleanup                             — delete untagged GHCR versions older
#                                            than 14 days (manifest-graph-aware;
#                                            never blocks the pipeline)
#   1. Lint                                — ruff check + format, then pylint
#   2. Tests   (3 parallel)                — bot-core / discord-gateway / blender-service
#   3. Build   (4 parallel, needs tests)   — push sha-<short> (+ semver) to GHCR
#                                            On PR: build local only, no push
#   4. Scan    (4 parallel, needs build)   — Trivy pulls pushed image, scans
#                                            On pass : promote `latest` tag
#                                            On fail : delete the sha-<short> tag from GHCR
#                                            On PR   : scans the locally-built image (no promote/delete)
#   5. Summary (needs all scans)           — final report
#
# Triggers:
#   - Push to main/master  → tests + build + push sha → scan → promote latest
#   - Push a git tag       → tests + build + push sha + semver → scan → promote latest
#   - Pull request         → tests + build local + scan local (no push)
#   - Manual dispatch      → tests + build + push sha → scan → promote latest
#
# Images published:
#   ghcr.io/gof2bountybot/bountybot-reborn-samx/bot-core
#   ghcr.io/gof2bountybot/bountybot-reborn-samx/discord-gateway
#   ghcr.io/gof2bountybot/bountybot-reborn-samx/blender-service        (CPU, python:3.13-slim-trixie)
#   ghcr.io/gof2bountybot/bountybot-reborn-samx/blender-service-gpu    (CUDA runtime, Python 3.13)
#
# Image tag lifecycle:
#   Build phase pushes:    sha-<short>   (+ {{version}} on git tag pushes)
#   Scan phase, on PASS:   adds `latest` (via `docker buildx imagetools create`)
#   Scan phase, on FAIL:   deletes the sha-<short> package version via `gh api`
#                          → the vulnerable image cannot be pulled from GHCR

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/gof2bountybot/bountybot-reborn-samx
  IMAGE_OWNER: gof2bountybot
  IMAGE_REPO: bountybot-reborn-samx

  # ── Trivy image-scan tuning ────────────────────────────────────────────────
  # FAIL_SEVERITY: comma-separated severities that BLOCK the push.
  #   strict        → "CRITICAL,HIGH"           (default — recommended)
  #   critical-only → "CRITICAL"
  #   report-only   → ""    (set SCAN_MODE=report-only below; severities ignored)
  TRIVY_FAIL_SEVERITY: "CRITICAL,HIGH"

  # SCAN_MODE: gate behaviour
  #   enforce      → fail the job (and delete the pushed image) if vulns at
  #                  FAIL_SEVERITY are found
  #   report-only  → upload SARIF + summary, never fail, keep the image tagged
  TRIVY_SCAN_MODE: "enforce"

  # Trivy DB scan timeout (image scans of large CUDA bases can be slow)
  TRIVY_TIMEOUT: "15m"

# ── Phase 0: Registry cleanup ────────────────────────────────────────────────

jobs:
  cleanup-registry:
    name: GHCR cleanup (untagged > 14 days)
    runs-on: ubuntu-latest
    # A cleanup hiccup must never block the pipeline.
    continue-on-error: true
    # The action is not safe to run in parallel against the same packages.
    concurrency:
      group: ghcr-cleanup
    permissions:
      packages: write

    steps:
      - name: Delete untagged images older than 14 days
        # Manifest-graph-aware deletion: buildx v6 provenance attestations and
        # multi-arch children appear as UNTAGGED package versions that tagged
        # images still reference — a naive untagged purge corrupts them. This
        # action walks the manifests and only deletes truly unreferenced
        # versions. Deleted version IDs are logged and restorable for 30 days
        # via the packages REST API.
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: "${{ env.IMAGE_REPO }}/bot-core,${{ env.IMAGE_REPO }}/discord-gateway,${{ env.IMAGE_REPO }}/blender-service,${{ env.IMAGE_REPO }}/blender-service-gpu"
          owner: ${{ env.IMAGE_OWNER }}
          delete-untagged: true
          older-than: 14 days
          validate: true

# ── Phase 1: Lint ────────────────────────────────────────────────────────────

  lint:
    name: Lint (ruff + pylint)
    runs-on: ubuntu-latest
    needs: cleanup-registry

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check (lint)
        run: ruff check services/bot-core/src services/bot-core/tests services/discord-gateway/src services/discord-gateway/tests services/blender-service/src services/blender-service/tests

      - name: Ruff format check
        run: ruff format --check services/bot-core/src services/bot-core/tests services/discord-gateway/src services/discord-gateway/tests services/blender-service/src services/blender-service/tests

      - name: Install Pylint
        run: pip install pylint

      - name: Pylint (lint)
        run: pylint --rcfile=utils/pylintrc services/bot-core/src services/bot-core/tests services/discord-gateway/src services/discord-gateway/tests services/blender-service/src services/blender-service/tests

# ── Phase 2: Tests ───────────────────────────────────────────────────────────

  test-bot-core:
    name: bot-core tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bountydb
          POSTGRES_USER: bounty
          POSTGRES_PASSWORD: bounty
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: services/bot-core
        run: pip install -r requirements.txt

      - name: Copy shared libs for host test imports
        # Mirrors the image build (bot-core/Dockerfile: COPY ./services/shared
        # /app/src/shared). Tests load the real shared.http_retry from
        # src/shared/ (conftest.py + test_d9t1), so copy the whole package, not
        # just bblogger. The src/shared/ mirror is intentionally untracked.
        run: cp services/shared/*.py services/bot-core/src/shared/ || true

      - name: Migrate CI database to head
        # The concurrency-locking and migration test modules run against a real
        # Postgres (tests/pg_env.py) and skip themselves unless the schema is
        # present, so the service container must be at alembic head before
        # pytest starts. Same invocation as auto-migrations.yml.
        working-directory: services/bot-core/src
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: bountydb
          POSTGRES_USER: bounty
          POSTGRES_PASSWORD: bounty
          PYTHONPATH: ${{ github.workspace }}/services/bot-core/src
        run: python -m persist.database.run_migration upgrade

      - name: Seed CI database from import_data
        # The JSONB migration tests verify round-trips over real seed rows, so
        # populate the game-data tables the same way app startup does (the
        # seeder is idempotent — it only fills empty tables).
        working-directory: services/bot-core/src
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: bountydb
          POSTGRES_USER: bounty
          POSTGRES_PASSWORD: bounty
          PYTHONPATH: ${{ github.workspace }}/services/bot-core/src
        run: |
          python - <<'EOF'
          import asyncio

          from persist.database.manager import db_manager
          from utils.auto_seeder import auto_seed_data


          async def main():
              await db_manager.initialize()
              await auto_seed_data()
              await db_manager.shutdown()


          asyncio.run(main())
          EOF

      - name: Run tests
        id: pytest
        working-directory: services/bot-core
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: bountydb
          POSTGRES_USER: bounty
          POSTGRES_PASSWORD: bounty
        run: |
          python -m pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-branch \
            --timeout=60 \
            --junitxml=junit.xml \
            -q

      - name: Publish test & coverage summary
        if: always()
        working-directory: services/bot-core
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, os, pathlib

          junit = ET.parse("junit.xml").getroot()
          suite = junit if junit.tag == "testsuite" else junit.find("testsuite")
          total   = int(suite.get("tests",   0))
          failed  = int(suite.get("failures",0)) + int(suite.get("errors", 0))
          skipped = int(suite.get("skipped", 0))
          passed  = total - failed - skipped
          duration = float(suite.get("time", 0))

          cov = ET.parse("coverage.xml").getroot()
          line_rate   = float(cov.get("line-rate",   0)) * 100
          branch_rate = float(cov.get("branch-rate", 0)) * 100

          status = "passed" if failed == 0 else f"{failed} failed"

          summary = f"""## bot-core test results

          | Metric | Value |
          |--------|-------|
          | Result | {status} |
          | Tests | {total} |
          | Passed | {passed} |
          | Failed | {failed} |
          | Skipped | {skipped} |
          | Duration | {duration:.1f}s |
          | Line coverage | {line_rate:.1f}% |
          | Branch coverage | {branch_rate:.1f}% |
          """

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-bot-core
          path: services/bot-core/coverage.xml
          if-no-files-found: warn

  test-discord-gateway:
    name: discord-gateway tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: services/discord-gateway
        run: pip install -r requirements.txt

      - name: Copy shared bblogger
        run: cp services/shared/bblogger.py services/discord-gateway/src/shared/bblogger.py || true

      - name: Run tests
        id: pytest
        working-directory: services/discord-gateway
        run: |
          python -m pytest tests/ \
            --cov=src \

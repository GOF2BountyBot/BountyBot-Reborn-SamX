  build-blender-gpu:
    name: blender-service (GPU) image
    runs-on: ubuntu-latest
    needs: [test-bot-core, test-discord-gateway, test-blender-service]
    permissions:
      contents: read
      packages: write
      security-events: write
    # NOTE: GPU builds run on standard ubuntu-latest — no GPU hardware is needed
    # to BUILD the image, only to RUN it. The CUDA runtime libs are baked in from
    # the nvidia/cuda base; actual GPU access requires nvidia-docker at runtime.

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/blender-service-gpu
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (load locally for scan)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/blender-service/Dockerfile.gpu
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=blender-gpu
          cache-to: type=gha,scope=blender-gpu,mode=max

      - name: Pick scan target tag
        id: scantag
        run: echo "tag=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Trivy scan (SARIF → Security tab)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.scantag.outputs.tag }}
          format: sarif
          output: trivy-blender-gpu.sarif
          ignore-unfixed: true
          vuln-type: os,library
          timeout: ${{ env.TRIVY_TIMEOUT }}
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-blender-gpu.sarif
          category: trivy-blender-gpu

      - name: Trivy scan (enforcement gate)
        id: trivy-gate
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.scantag.outputs.tag }}
          format: table
          severity: ${{ env.TRIVY_FAIL_SEVERITY }}
          exit-code: ${{ env.TRIVY_SCAN_MODE == 'enforce' && '1' || '0' }}
          ignore-unfixed: true
          vuln-type: os,library
          timeout: ${{ env.TRIVY_TIMEOUT }}
          output: trivy-blender-gpu.txt
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

      - name: Append scan results to job summary
        if: always()
        run: |
          {
            echo "## Trivy scan — blender-service (GPU)"
            echo ""
            echo "Mode: \`${TRIVY_SCAN_MODE}\` · Fail severity: \`${TRIVY_FAIL_SEVERITY:-none}\` · Result: ${{ steps.trivy-gate.outcome }}"
            echo ""
            echo '```'
            cat trivy-blender-gpu.txt 2>/dev/null || echo "(no findings file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push to GHCR (post-scan)
        if: github.event_name != 'pull_request' && success()
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/blender-service/Dockerfile.gpu
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=blender-gpu

# ── Summary ──────────────────────────────────────────────────────────────────

  summary:
    name: Pipeline summary
    runs-on: ubuntu-latest
    needs: [build-bot-core, build-discord-gateway, build-blender-cpu, build-blender-gpu]
    if: always()

    steps:
      - name: Write job summary
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          PUSHED="${{ github.event_name != 'pull_request' }}"

          if [ "$PUSHED" = "true" ]; then
            STATUS_LINE="All tests passed. Images **pushed** to GHCR."
          else
            STATUS_LINE="PR build — tests ran, images built but **not pushed**."
          fi

          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          ## Pipeline results

          ${STATUS_LINE}

          | Image | Tag |
          |-------|-----|
          | \`bot-core\` | \`sha-${SHA_SHORT}\`, \`latest\` |
          | \`discord-gateway\` | \`sha-${SHA_SHORT}\`, \`latest\` |
          | \`blender-service\` (CPU) | \`sha-${SHA_SHORT}\`, \`latest\` |
          | \`blender-service-gpu\` (GPU) | \`sha-${SHA_SHORT}\`, \`latest\` |

          ### Pull from GHCR

          \`\`\`bash
          docker pull ghcr.io/gof2bountybot/bountybot-reborn-samx/bot-core:latest
          docker pull ghcr.io/gof2bountybot/bountybot-reborn-samx/discord-gateway:latest
          docker pull ghcr.io/gof2bountybot/bountybot-reborn-samx/blender-service:latest
          docker pull ghcr.io/gof2bountybot/bountybot-reborn-samx/blender-service-gpu:latest
          \`\`\`
          EOF

# ── Phase 5: Summary ─────────────────────────────────────────────────────────

  summary:
    name: Pipeline summary
    runs-on: ubuntu-latest
    needs: [scan-bot-core, scan-discord-gateway, scan-blender-cpu, scan-blender-gpu]
    if: always()

    steps:
      - name: Write job summary
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          PUSHED="${{ github.event_name != 'pull_request' }}"

          if [ "$PUSHED" = "true" ]; then
            STATUS_LINE="All tests + scans passed. Images **pushed** to GHCR with \`latest\` promoted."
          else
            STATUS_LINE="PR build — tests + scans ran on locally-built images. Nothing pushed."
          fi

          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          ## Pipeline results

          ${STATUS_LINE}

          | Image | Tag |
          |-------|-----|
          | \`bot-core\` | \`sha-${SHA_SHORT}\`, \`latest\` |
          | \`discord-gateway\` | \`sha-${SHA_SHORT}\`, \`latest\` |
          | \`blender-service\` (CPU) | \`sha-${SHA_SHORT}\`, \`latest\` |
          | \`blender-service-gpu\` (GPU) | \`sha-${SHA_SHORT}\`, \`latest\` |

          ### Pull from GHCR

          \`\`\`bash
          docker pull ghcr.io/gof2bountybot/bountybot-reborn-samx/bot-core:latest
          docker pull ghcr.io/gof2bountybot/bountybot-reborn-samx/discord-gateway:latest
          docker pull ghcr.io/gof2bountybot/bountybot-reborn-samx/blender-service:latest
          docker pull ghcr.io/gof2bountybot/bountybot-reborn-samx/blender-service-gpu:latest
          \`\`\`

          > Failed scans: the corresponding \`sha-\` tag is **deleted from GHCR** automatically;
          > \`latest\` is **not** moved.
          EOF

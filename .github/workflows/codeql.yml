name: CodeQL (source SAST)

# Runs GitHub's CodeQL static analyzer against the Python source.
# Results are uploaded to the repo's Security tab as code-scanning alerts.
#
# Triggers:
#   - Push to main/master      → full scan, blocks merges via branch protection if rules added
#   - Pull request → main/master → scan diff
#   - Weekly schedule          → re-scan with latest CodeQL queries (catches newly-disclosed patterns)
#   - Manual dispatch          → on-demand
#
# Failure policy:
#   CodeQL alerts surface in the PR/Security tab. By default this workflow does NOT fail the
#   pipeline on findings — alerts are reviewed in the Security tab. To enforce blocking, enable
#   "Required status checks" → "CodeQL" in branch protection, and configure code-scanning
#   default-setup severity gates in repo Settings → Code security.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Every Monday at 06:00 UTC — re-scan to catch newly-published CodeQL queries / CVEs
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required to upload SARIF results to the Security tab
      security-events: write
      # Required for actions/checkout
      contents: read
      # Required to read PR metadata
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Security-focused advanced setup. Query suite + path exclusions live in
          # .github/codeql/codeql-config.yml (version-controlled).
          #
          # NOTE: code QUALITY findings (maintainability/reliability, the /security/quality
          # view) come from GitHub's separate managed "Code Quality" feature, which is NOT
          # driven by this workflow and cannot read this config-file. There is currently no
          # production-ready way to configure Code Quality in YAML (the codeql-action
          # `analysis-kinds`/`quality-queries` inputs are internal/experimental). Quality
          # is configured in repo Settings → Code security → Code Quality.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

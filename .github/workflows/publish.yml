            echo ""
            echo '```'
            cat trivy-blender-cpu.txt 2>/dev/null || echo "(no findings file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push to GHCR (post-scan)
        if: github.event_name != 'pull_request' && success()

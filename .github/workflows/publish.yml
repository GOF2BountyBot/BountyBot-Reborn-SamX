# ── Phase 3: Build & Publish ─────────────────────────────────────────────────
# All four build jobs require every test job to pass before they run.
# On pull_request events images are built but not pushed (smoke test only).

  build-bot-core:
    name: bot-core image
    runs-on: ubuntu-latest
    needs: [test-bot-core, test-discord-gateway, test-blender-service]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/bot-core
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/bot-core/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bot-core
          cache-to: type=gha,scope=bot-core,mode=max

  build-discord-gateway:
    name: discord-gateway image
    runs-on: ubuntu-latest
    needs: [test-bot-core, test-discord-gateway, test-blender-service]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/discord-gateway
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/discord-gateway/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=discord-gateway
          cache-to: type=gha,scope=discord-gateway,mode=max

  build-blender-cpu:
    name: blender-service (CPU) image
    runs-on: ubuntu-latest
    needs: [test-bot-core, test-discord-gateway, test-blender-service]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/blender-service
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/blender-service/Dockerfile.cpu
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=blender-cpu
          cache-to: type=gha,scope=blender-cpu,mode=max

  build-blender-gpu:
    name: blender-service (GPU) image
    runs-on: ubuntu-latest
    needs: [test-bot-core, test-discord-gateway, test-blender-service]
    permissions:
      contents: read
      packages: write
    # NOTE: GPU builds run on standard ubuntu-latest — no GPU hardware is needed
    # to BUILD the image, only to RUN it. The CUDA runtime libs are baked in from
    # the nvidia/cuda base; actual GPU access requires nvidia-docker at runtime.

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/blender-service-gpu
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/blender-service/Dockerfile.gpu
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=blender-gpu
          cache-to: type=gha,scope=blender-gpu,mode=max

# ── Summary ──────────────────────────────────────────────────────────────────

  summary:
    name: Pipeline summary
    runs-on: ubuntu-latest
    needs: [build-bot-core, build-discord-gateway, build-blender-cpu, build-blender-gpu]
    if: always()

    steps:
      - name: Write job summary
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          PUSHED="${{ github.event_name != 'pull_request' }}"

          if [ "$PUSHED" = "true" ]; then
            STATUS_LINE="All tests passed. Images **pushed** to GHCR."
          else
            STATUS_LINE="PR build — tests ran, images built but **not pushed**."
          fi

          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          ## Pipeline results

          ${STATUS_LINE}

          | Image | Tag |
          |-------|-----|
          | \`bot-core\` | \`sha-${SHA_SHORT}\`, \`latest\` |
          | \`discord-gateway\` | \`sha-${SHA_SHORT}\`, \`latest\` |
          | \`blender-service\` (CPU) | \`sha-${SHA_SHORT}\`, \`latest\` |
          | \`blender-service-gpu\` (GPU) | \`sha-${SHA_SHORT}\`, \`latest\` |

          ### Pull from GHCR

          \`\`\`bash
          docker pull ghcr.io/gof2bountybot/bountybot-reborn-samx/bot-core:latest
          docker pull ghcr.io/gof2bountybot/bountybot-reborn-samx/discord-gateway:latest
          docker pull ghcr.io/gof2bountybot/bountybot-reborn-samx/blender-service:latest
          docker pull ghcr.io/gof2bountybot/bountybot-reborn-samx/blender-service-gpu:latest
          \`\`\`
          EOF

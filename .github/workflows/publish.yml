# ── Phase 3: Build, Scan & Publish ───────────────────────────────────────────
# All four build jobs require every test job to pass before they run.
#
# Per-image pipeline:
#   1. Build image with load:true (single-platform, into local Docker daemon)
#   2. Trivy SARIF scan → upload to GitHub Security tab (always runs)
#   3. Trivy enforcement scan → fails the job if TRIVY_SCAN_MODE=enforce and
#      vulns at TRIVY_FAIL_SEVERITY are present
#   4. Push to GHCR — only if scan passed AND event is not pull_request
#
# Tunable knobs (set at workflow env block, top of file):
#   TRIVY_FAIL_SEVERITY   — "CRITICAL,HIGH" (default), "CRITICAL", or ""
#   TRIVY_SCAN_MODE       — "enforce" (default) or "report-only"

  build-bot-core:
    name: bot-core image
    runs-on: ubuntu-latest
    needs: [test-bot-core, test-discord-gateway, test-blender-service]
    permissions:
      contents: read
      packages: write
      security-events: write   # Trivy SARIF upload

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/bot-core
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (load locally for scan)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/bot-core/Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bot-core
          cache-to: type=gha,scope=bot-core,mode=max

      - name: Pick scan target tag
        id: scantag
        run: echo "tag=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Trivy scan (SARIF → Security tab)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.scantag.outputs.tag }}
          format: sarif
          output: trivy-bot-core.sarif
          ignore-unfixed: true
          vuln-type: os,library
          timeout: ${{ env.TRIVY_TIMEOUT }}
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-bot-core.sarif
          category: trivy-bot-core

      - name: Trivy scan (enforcement gate)
        id: trivy-gate
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.scantag.outputs.tag }}
          format: table
          severity: ${{ env.TRIVY_FAIL_SEVERITY }}
          exit-code: ${{ env.TRIVY_SCAN_MODE == 'enforce' && '1' || '0' }}
          ignore-unfixed: true
          vuln-type: os,library
          timeout: ${{ env.TRIVY_TIMEOUT }}
          output: trivy-bot-core.txt
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

      - name: Append scan results to job summary
        if: always()
        run: |
          {
            echo "## Trivy scan — bot-core"
            echo ""
            echo "Mode: \`${TRIVY_SCAN_MODE}\` · Fail severity: \`${TRIVY_FAIL_SEVERITY:-none}\` · Result: ${{ steps.trivy-gate.outcome }}"
            echo ""
            echo '```'
            cat trivy-bot-core.txt 2>/dev/null || echo "(no findings file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push to GHCR (post-scan)
        if: github.event_name != 'pull_request' && success()
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/bot-core/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bot-core

  build-discord-gateway:
    name: discord-gateway image
    runs-on: ubuntu-latest
    needs: [test-bot-core, test-discord-gateway, test-blender-service]
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/discord-gateway
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (load locally for scan)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/discord-gateway/Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=discord-gateway
          cache-to: type=gha,scope=discord-gateway,mode=max

      - name: Pick scan target tag
        id: scantag
        run: echo "tag=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Trivy scan (SARIF → Security tab)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.scantag.outputs.tag }}
          format: sarif
          output: trivy-discord-gateway.sarif
          ignore-unfixed: true
          vuln-type: os,library
          timeout: ${{ env.TRIVY_TIMEOUT }}
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-discord-gateway.sarif
          category: trivy-discord-gateway

      - name: Trivy scan (enforcement gate)
        id: trivy-gate
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.scantag.outputs.tag }}
          format: table
          severity: ${{ env.TRIVY_FAIL_SEVERITY }}
          exit-code: ${{ env.TRIVY_SCAN_MODE == 'enforce' && '1' || '0' }}
          ignore-unfixed: true
          vuln-type: os,library
          timeout: ${{ env.TRIVY_TIMEOUT }}
          output: trivy-discord-gateway.txt
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

      - name: Append scan results to job summary
        if: always()
        run: |
          {
            echo "## Trivy scan — discord-gateway"
            echo ""
            echo "Mode: \`${TRIVY_SCAN_MODE}\` · Fail severity: \`${TRIVY_FAIL_SEVERITY:-none}\` · Result: ${{ steps.trivy-gate.outcome }}"
            echo ""
            echo '```'
            cat trivy-discord-gateway.txt 2>/dev/null || echo "(no findings file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push to GHCR (post-scan)
        if: github.event_name != 'pull_request' && success()
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/discord-gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=discord-gateway

  build-blender-cpu:
    name: blender-service (CPU) image
    runs-on: ubuntu-latest
    needs: [test-bot-core, test-discord-gateway, test-blender-service]
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/blender-service
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (load locally for scan)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/blender-service/Dockerfile.cpu
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=blender-cpu
          cache-to: type=gha,scope=blender-cpu,mode=max

      - name: Pick scan target tag
        id: scantag
        run: echo "tag=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Trivy scan (SARIF → Security tab)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.scantag.outputs.tag }}
          format: sarif
          output: trivy-blender-cpu.sarif
          ignore-unfixed: true
          vuln-type: os,library
          timeout: ${{ env.TRIVY_TIMEOUT }}
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-blender-cpu.sarif
          category: trivy-blender-cpu

      - name: Trivy scan (enforcement gate)
        id: trivy-gate
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.scantag.outputs.tag }}
          format: table
          severity: ${{ env.TRIVY_FAIL_SEVERITY }}
          exit-code: ${{ env.TRIVY_SCAN_MODE == 'enforce' && '1' || '0' }}
          ignore-unfixed: true
          vuln-type: os,library
          timeout: ${{ env.TRIVY_TIMEOUT }}
          output: trivy-blender-cpu.txt
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

      - name: Append scan results to job summary
        if: always()

[tool.pylint]
rcfile = "utils/pylintrc"

[tool.isort]
profile = "black"
line_length = 120
include_trailing_comma = true
use_parentheses = true
ensure_newline_before_comments = false
skip_glob = ["**/lib/AEPi/**"]

[tool.pytest.ini_options]
testpaths = ["services"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:discord.player",
    "ignore::DeprecationWarning:fastapi.routing",
    "ignore:.*audioop.*:DeprecationWarning",
    "ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*:DeprecationWarning",
    "ignore:Pydantic serializer warnings.*:UserWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "services/blender-service/src/lib/AEPi/**",
    "api-test.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E712", "E402"]

[tool.ruff.lint.per-file-ignores]
"services/bot-core/src/persist/models/*.py" = ["F821"]
